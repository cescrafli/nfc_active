<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Kartu NFC - Google Maps Direct</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      max-width: 460px;
      width: 100%;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h2 { margin: 0 0 6px; color: #202124; font-size: 22px; }
    p { margin: 0 0 18px; color: #5f6368; font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 600; color: #3c4043; margin-bottom: 6px; }

    /* Search Wrapper & Dropdown */
    .search-wrapper {
      position: relative;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dadce0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }

    .dropdown-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 260px;
      overflow-y: auto;
      z-index: 20;
      display: none;
    }
    .dropdown-item {
      padding: 11px 14px;
      border-bottom: 1px solid #f1f3f4;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover, .dropdown-item:active { background: #f1f6fe; }
    .dropdown-item strong {
      display: block;
      font-size: 14px;
      color: #202124;
      margin-bottom: 2px;
    }
    .dropdown-item small {
      display: block;
      font-size: 12px;
      color: #5f6368;
      line-height: 1.35;
    }
    .dropdown-status {
      padding: 12px 14px;
      font-size: 13px;
      color: #5f6368;
      text-align: center;
    }

    .preview-box {
      margin-top: 16px;
      padding: 12px;
      background: #f8f9fa;
      border: 1px solid #e8eaed;
      border-radius: 10px;
      display: none;
    }
    .preview-box strong { display: block; color: #202124; font-size: 14px; margin-bottom: 2px; }
    .preview-box .addr { display: block; color: #5f6368; font-size: 12px; margin-bottom: 6px; }
    .preview-box span { display: block; color: #1a73e8; font-size: 11px; word-break: break-all; margin-bottom: 10px; }

    /* Pratinjau Peta Google Maps Asli */
    .map-frame {
      width: 100%;
      height: 200px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      background: #eef0f2;
    }
    .map-hint {
      font-size: 11px;
      color: #5f6368;
      margin-top: 6px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #dadce0; color: #80868b; cursor: not-allowed; }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Aktivasi Kartu NFC</h2>
  <p>Ketik nama toko dan kota Anda (atau tempel link Google Maps), pilih dari daftar, lalu cek peta di bawah sebelum menulis ke kartu.</p>

  <label for="store-input">Nama Toko & Kota / Link Google Maps</label>
  <div class="search-wrapper">
    <input id="store-input" type="text" placeholder="Contoh: Kopi Kenangan Galaxy Bekasi..." autocomplete="off" />
    <div id="dropdown" class="dropdown-list"></div>
  </div>

  <div class="preview-box" id="preview-box">
    <strong id="preview-name"></strong>
    <small class="addr" id="preview-addr"></small>
    <span id="preview-url"></span>
    <iframe id="map-preview" class="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="map-hint">👆 Peta di atas adalah lokasi Google Maps yang akan terbuka saat kartu di-tap. Jika kurang pas, tambahkan nama jalan/kecamatan/kota.</div>
  </div>

  <button id="activate-btn" disabled>Aktivasi & Tulis ke Kartu NFC</button>
  <div id="status"></div>
</div>

<script>
  let targetUrl = "";
  let debounceTimer = null;
  let mapTimer = null;
  let searchController = null;

  const storeInput = document.getElementById("store-input");
  const dropdown = document.getElementById("dropdown");
  const previewBox = document.getElementById("preview-box");
  const previewName = document.getElementById("preview-name");
  const previewAddr = document.getElementById("preview-addr");
  const previewUrl = document.getElementById("preview-url");
  const mapPreview = document.getElementById("map-preview");
  const activateBtn = document.getElementById("activate-btn");

  function setSelection(title, subtitle, queryOrUrl, immediateMap = false) {
    const isDirectUrl = /^https?:\/\//i.test(queryOrUrl);
    targetUrl = isDirectUrl
      ? queryOrUrl
      : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryOrUrl)}`;

    previewName.textContent = title;
    previewAddr.textContent = subtitle || "";
    previewAddr.style.display = subtitle ? "block" : "none";
    previewUrl.textContent = targetUrl;
    previewBox.style.display = "block";
    activateBtn.disabled = false;

    clearTimeout(mapTimer);
    if ( isDirectUrl ) {
      mapPreview.style.display = "none";
    } else {
      mapPreview.style.display = "block";
      const loadMap = () => {
        const embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(queryOrUrl)}&hl=id&z=16&output=embed`;
        if (mapPreview.src !== embedUrl) mapPreview.src = embedUrl;
      };
      if (immediateMap) loadMap();
      else mapTimer = setTimeout(loadMap, 600);
    }
  }

  storeInput.addEventListener("input", () => {
    const q = storeInput.value.trim();
    clearTimeout(debounceTimer);

    if (q.length < 3) {
      dropdown.style.display = "none";
      previewBox.style.display = "none";
      activateBtn.disabled = true;
      return;
    }

    // Jika pengguna menempel link Google Maps langsung (misal https://maps.app.goo.gl/... atau https://g.page/...)
    if (/^https?:\/\//i.test(q)) {
      dropdown.style.display = "none";
      setSelection("Link Google Maps Langsung", "Tautan yang ditempel akan langsung ditulis ke kartu", q, true);
      return;
    }

    setSelection("Pencarian Google Maps: " + q, "Pilih dari daftar atau cek peta di bawah", q, false);
    debounceTimer = setTimeout(() => searchPlaces(q), 280);
  });

  async function searchPlaces(q) {
    if (searchController) searchController.abort();
    searchController = new AbortController();

    dropdown.style.display = "block";
    dropdown.replaceChildren();
    const loading = document.createElement("div");
    loading.className = "dropdown-status";
    loading.textContent = "Mencari tempat...";
    dropdown.appendChild(loading);

    try {
      const res = await fetch(`/api/places?q=${encodeURIComponent(q)}`, { signal: searchController.signal });
      const data = await res.json();
      const items = data.items || [];

      dropdown.replaceChildren();

      // Opsi 1: Selalu sediakan pilihan sesuai ketikan persis pengguna
      dropdown.appendChild(
        createDropdownItem(
          `🔍 Cari di Google Maps: "${q}"`,
          "Pakai persis nama yang Anda ketik (pasti ketemu jika ada di Google Maps)",
          () => {
            dropdown.style.display = "none";
            setSelection(q, "Pencarian langsung Google Maps", q, true);
          }
        )
      );

      // Opsi 2+: Daftar saran dari Google + peta Indonesia
      items.forEach((it) => {
        if (it.title.toLowerCase() === q.toLowerCase()) return;
        dropdown.appendChild(
          createDropdownItem(it.title, it.subtitle, () => {
            storeInput.value = it.query;
            dropdown.style.display = "none";
            setSelection(it.title, it.subtitle, it.query, true);
          })
        );
      });
    } catch (err) {
      if (err.name === "AbortError") return;
      dropdown.style.display = "none";
    }
  }

  function createDropdownItem(title, subtitle, onSelect) {
    const div = document.createElement("div");
    div.className = "dropdown-item";
    const strong = document.createElement("strong");
    strong.textContent = title;
    const small = document.createElement("small");
    small.textContent = subtitle;
    div.append(strong, small);
    div.addEventListener("click", onSelect);
    return div;
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrapper")) {
      dropdown.style.display = "none";
    }
  });

  storeInput.addEventListener("focus", () => {
    if (dropdown.children.length > 0 && storeInput.value.trim().length >= 3) {
      dropdown.style.display = "block";
    }
  });

  // Tulis ke Kartu NFC via Google Chrome (Web NFC API)
  activateBtn.addEventListener("click", async () => {
    const statusBox = document.getElementById("status");
    statusBox.style.display = "block";
    dropdown.style.display = "none";

    if (!("NDEFReader" in window)) {
      statusBox.style.background = "#fdecea";
      statusBox.style.color = "#b71c1c";
      statusBox.textContent = "Fitur Write NFC hanya berjalan di browser Google Chrome pada HP Android (dengan link HTTPS).";
      return;
    }

    try {
      const ndef = new NDEFReader();
      statusBox.style.background = "#fff8e1";
      statusBox.style.color = "#e65100";
      statusBox.textContent = "📡 Tempelkan dan tahan kartu NFC di belakang HP Anda sekarang...";

      await ndef.write({
        records: [{ recordType: "url", data: targetUrl }]
      });

      statusBox.style.background = "#e8f5e9";
      statusBox.style.color = "#1b5e20";
      statusBox.textContent = "✅ Aktivasi Berhasil! Kartu NFC sudah terisi. Silakan tutup Chrome dan coba tempelkan ulang kartu Anda.";
    } catch (error) {
      statusBox.style.background = "#fdecea";
      statusBox.style.color = "#b71c1c";
      statusBox.textContent = "Gagal menulis ke kartu: " + error.message;
    }
  });
</script>

</body>
</html>
